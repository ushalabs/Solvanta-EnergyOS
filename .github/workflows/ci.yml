name: Solvanta CI

on:
  push:
    branches: [ main, master, 'phase/**', 'fix/**' ]
  pull_request:
    branches: [ main, master ]

jobs:
  audit:
    name: Repository Audit & Integrity Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify Documentation & Contracts
        run: |
          test -f Solvanta.md
          test -f AntiGravity_prompt.md
          test -f UI_DESIGN_SPEC.md
          test -f README.md
          test -f docs/STATUS.md
          test -f docs/PHASE_APPROVALS.md
          test -f docs/DECISIONS.md
          test -f docs/ARCHITECTURE.md
          test -f docs/API_CONTRACT.md
          test -f docs/DOMAIN_ASSUMPTIONS.md
          test -f docs/TEST_PLAN.md
          test -f docs/COMPETITOR_MATRIX.md
          echo "Phase 0 delivery contract verified."

  backend-tests:
    name: Backend Pytest & Migrations Suite
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: solvanta_user
          POSTGRES_PASSWORD: solvanta_dev_password
          POSTGRES_DB: solvanta_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Alembic Migrations
        env:
          DATABASE_URL: postgresql+asyncpg://solvanta_user:solvanta_dev_password@localhost:5432/solvanta_db
        run: |
          cd backend
          alembic upgrade head

      - name: Run Demo Seed Script
        env:
          DATABASE_URL: postgresql+asyncpg://solvanta_user:solvanta_dev_password@localhost:5432/solvanta_db
        run: |
          python backend/scripts/seed_demo_data.py

      - name: Run Backend Pytest Suite
        env:
          DATABASE_URL: postgresql+asyncpg://solvanta_user:solvanta_dev_password@localhost:5432/solvanta_db
          BACKEND_ENV: test
        run: |
          cd backend
          pytest -v

  mobile-tests:
    name: Mobile TypeScript & Jest Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: mobile/package-lock.json

      - name: Install Dependencies
        run: |
          cd mobile
          npm install --legacy-peer-deps

      - name: Run TypeScript Typecheck
        run: |
          cd mobile
          npx tsc --noEmit

      - name: Run Jest Test Suite
        run: |
          cd mobile
          npm test
